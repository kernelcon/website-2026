services:
  node:
    image: "node:16"
    container_name: "kernelcon"
    user: "node"
    working_dir: /home/app/
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/home/app/
    expose:
      - "3000"
    ports:
      - "8080:3000"
    command: bash -c "npm install && npm run start"
